# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
# Used by `make release` to prepend a Keep a Changelog section.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
          {% if commit.scope %} ({{ commit.scope }}){% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true
# Keep historical hand-written sections; make release only prepends.
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Chores" },
    { message = "^test", group = "Chores" },
    { message = "^ci", group = "Chores" },
    { message = "^refactor", group = "Chores" },
    { message = "^style", group = "Chores" },
    { message = "^perf", group = "Chores" },
    { message = "^build", group = "Chores" },
    { message = "^ci\\(", group = "Chores" },
    { message = "^Merge ", skip = true },
    { message = ".*", group = "Other" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
# Ignore test/experiment tags such as v0.1.1-test and v0.1.5-quicklook.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
ignore_tags = ".*-.*"
