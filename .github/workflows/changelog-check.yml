name: Version bump (advisory)

# Reports whether APP_VERSION moved on a release-worthy PR. This is not a
# required status check; do not enable branch protection on it until that
# is an explicit decision. CHANGELOG.md is generated by `make release`,
# not per pull request.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-version:
    name: APP_VERSION (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check APP_VERSION for release-worthy changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          BASE="origin/${BASE_REF}"
          echo "Diff against ${BASE}"
          git diff --name-only "${BASE}...HEAD"
          echo

          worthy=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|ui/*|run.py|portableai.spec|packaging/*|branding/*|install.sh)
                worthy=1
                ;;
            esac
          done < <(git diff --name-only "${BASE}...HEAD")

          if [ "$worthy" -eq 0 ]; then
            echo "No release-worthy paths changed. APP_VERSION bump not required."
            echo "This check is advisory and is not a required status check."
            exit 0
          fi

          if git diff "${BASE}...HEAD" -- ui/server.py | grep -q 'APP_VERSION'; then
            echo "APP_VERSION changed in ui/server.py. OK."
            echo "This check is advisory and is not a required status check."
            exit 0
          fi

          echo "APP_VERSION wasn't bumped — update it in ui/server.py"
          echo "This PR changes packaged/runtime files but ui/server.py APP_VERSION is unchanged."
          echo "Bump APP_VERSION on the PR, or rely on \`make release VERSION=vX.Y.Z\` at release time."
          echo "CHANGELOG.md is generated by make release; do not hand-edit it per PR."
          echo "This check is advisory and is not a required status check."
          exit 1
